player:
  default_bitrate: auto
  default_size: medium
ui:
  refresh_interval: 600
  theme: light
  timezone: Europe/Berlin
ultimate_backend:
  # OPTIONAL: browser-reachable origin (with CORS for this UI), only for in-browser
  # Replay. Catchup DOWNLOAD works without it (Flask talks to `url` server-side).
  public_url: ""
  timeout: 20
  url: http://json-ultimate:3000
webepg:
  timeout: 20
  url: http://json-webepg:8080
