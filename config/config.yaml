player:
  default_bitrate: auto
  default_size: medium
ui:
  refresh_interval: 600
  theme: light
  timezone: Europe/Berlin
ultimate_backend:
  # Browser-reachable origin (reverse proxy with CORS for this UI). Required for catchup.
  public_url: ""
  timeout: 20
  url: http://json-ultimate:3000
webepg:
  timeout: 20
  url: http://json-webepg:8080
