name: Ultimate UI - Docker Build and Publish

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Manual trigger
  schedule:
    # Weekly security scan (Monday 3AM)
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running main/tag pipeline (it may be mid-deploy); do cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_IMAGE: nirvana777/ultimate-ui
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  # Publish on pushes to main/master AND on v* tags. (The old condition only matched
  # branches, so tag builds were never pushed although the metadata step tags them.)
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install linting tools
        run: pip install -r requirements.dev.txt

      # black / isort / mypy settings live in pyproject.toml
      - name: Run Black (format check)
        run: black --check src/ tests/

      - name: Run isort (import sorting check)
        run: isort --check-only src/ tests/

      - name: Run Flake8 (linting)
        run: flake8 src/ tests/ --max-line-length=100 --exclude=__pycache__

      - name: Run MyPy (type checking)
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The pinned runtime deps (requests, gunicorn, click, urllib3) need Python >= 3.10;
        # 3.9 cannot install them. The Docker image uses 3.11.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements.dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit/test-results-${{ matrix.python-version }}.xml
            htmlcov/

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5   # v3 runs on a runner GitHub no longer supports
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          flags: unittests
          name: ultimate-ui-python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultimate-ui-react
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ultimate-ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Lazy shaka chunk, bundle size budget, key strings in the bundle, ...
      - name: Verify build output
        run: bash verify-build.sh

      # Production dependencies only. Dev-tool advisories (vite/esbuild dev server) do
      # not ship in the bundle; moderate prod advisories are tracked by Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # CodeQL runs in its own workflow (.github/workflows/codeql.yml). It used to run twice,
  # once here and once there, both uploading to the same "/language:python" category.

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install security tools
        run: pip install pip-audit bandit

      # Replaces `safety check ... || true`, which never failed the build.
      # Blocking: fails the job when a pinned runtime dependency has a known advisory.
      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt

      - name: Run Bandit (security linting, medium+ severity)
        run: bandit -r src/ -ll

      - name: Bandit JSON report
        if: always()
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/python
            p/security-audit
            p/owasp-top-ten
            p/flask
        env:
          # Disable cloud/metrics to keep it fully local
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "false"
        continue-on-error: true

      - name: Generate Semgrep SARIF
        if: always()
        run: |
          semgrep --config=p/python --config=p/security-audit --config=p/owasp-top-ten --config=p/flask --sarif --output=semgrep.sarif . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        if: github.event_name != 'pull_request'
        with:
          project: 'ultimate-ui'
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental
            --failOnCVSS 7
            --scan src/

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep.sarif
            dependency-check-report.html

  docker-build:
    needs: [ lint, test, frontend-check, security ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-scout:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: trivy-container

  docker-test:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ultimate-ui:test
          platforms: linux/amd64  # Test only amd64 since CI runners are amd64
          cache-from: type=gha

      - name: Run container smoke test
        timeout-minutes: 3
        run: |
          # Minimal config; both upstreams are deliberately unreachable (nothing listens on
          # these ports inside the container), which lets us test the error path too.
          mkdir -p test-config
          cat > test-config/config.yaml << 'EOF'
          webepg:
            url: "http://localhost:8080"
            timeout: 1
          ultimate_backend:
            url: "http://localhost:3000"
            timeout: 1
          ui:
            theme: "dark"
            refresh_interval: 300
            timezone: "UTC"
          EOF

          cleanup() {
            docker stop ultimate-ui-test >/dev/null 2>&1 || true
            docker rm -f ultimate-ui-test >/dev/null 2>&1 || true
          }
          fail() {
            echo "❌ $1"
            docker ps -a | grep ultimate-ui-test || true
            echo "Container logs:"
            docker logs ultimate-ui-test 2>&1 | tail -50 || true
            cleanup
            exit 1
          }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$@"; }

          docker run -d --name ultimate-ui-test \
            -p 7779:7779 \
            -v "$(pwd)/test-config:/app/config:ro" \
            ultimate-ui:test

          # Wait for the app (up to 30 s) instead of a blind sleep
          for _ in $(seq 1 30); do
            [ "$(code http://localhost:7779/health)" = "200" ] && break
            sleep 1
          done

          [ "$(code http://localhost:7779/health)" = "200" ] || fail "/health did not return 200"

          curl -s --max-time 5 http://localhost:7779/ | grep -q "__ULTIMATE_CONFIG__" \
            || fail "/ does not serve the SPA shell"

          # The SPA bundle must be baked into the image (a bind mount over /app/src/static
          # or a broken frontend build stage would break exactly this)
          [ "$(code http://localhost:7779/static/dist/assets/index.js)" = "200" ] \
            || fail "SPA bundle missing from image"

          # CSRF guard: a state-changing request without the custom header must be refused
          [ "$(code -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:7779/config)" = "403" ] \
            || fail "POST /config without X-Requested-With was not rejected"

          # Upstream down must surface as an error, never as an empty list
          [ "$(code http://localhost:7779/api/epg/channels)" = "502" ] \
            || fail "unreachable WebEPG did not produce a 502"

          # Must not run as root
          [ "$(docker exec ultimate-ui-test id -u)" != "0" ] || fail "container runs as root"

          echo "✅ Smoke test passed"
          cleanup

  deploy:
    needs: [docker-build, docker-test, docker-scout]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # Optional but recommended: output of `ssh-keyscan -t ed25519 <host>`
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            SSH_OPTS="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS secret not set - the server host key is NOT verified"
            SSH_OPTS="-o StrictHostKeyChecking=no"
          fi

          ssh $SSH_OPTS -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -e
            IMAGE='${{ env.DOCKER_IMAGE }}:latest'
            CONFIG_DIR=/opt/ultimate-ui/config

            docker pull "$IMAGE"

            # The image's user is uid 10001 (it used to be a dynamic uid). Run as whoever owns
            # the config directory so the Config page can keep writing config.yaml.
            OWNER="$(stat -c '%u:%g' "$CONFIG_DIR")"
            if [ "$OWNER" = "0:0" ]; then
              echo "WARNING: $CONFIG_DIR is owned by root; run: chown -R 10001:10001 $CONFIG_DIR"
              OWNER="10001:10001"
            fi

            docker stop ultimate-ui-staging || true
            docker rm ultimate-ui-staging || true

            docker run -d \
              --name ultimate-ui-staging \
              --restart unless-stopped \
              --user "$OWNER" \
              -p 7779:7779 \
              -v "$CONFIG_DIR":/app/config \
              "$IMAGE"
          REMOTE

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -f ~/.ssh/known_hosts ]; then SSH_OPTS="-o StrictHostKeyChecking=yes"; else SSH_OPTS="-o StrictHostKeyChecking=no"; fi
          # Wait for the app instead of a blind sleep; the image's own HEALTHCHECK also runs.
          ssh $SSH_OPTS -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'for i in $(seq 1 30); do curl -fsS http://localhost:7779/health && exit 0; sleep 1; done; docker logs --tail 50 ultimate-ui-staging; exit 1'
          echo "Deployment verified successfully!"

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Ultimate UI deployed to staging!"
          echo "URL: http://${{ secrets.DEPLOY_HOST_STAGING }}:7779"

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-check, security, docker-build, docker-scout, docker-test, deploy]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          echo "## Ultimate UI Build Summary"
          echo ""
          echo "| Job | Status | Details |"
          echo "|-----|--------|---------|"
          echo "| Lint | ${{ needs.lint.result }} | Python code quality checks |"
          echo "| Test | ${{ needs.test.result }} | Unit tests across Python versions |"
          echo "| Frontend Check | ${{ needs.frontend-check.result }} | Typecheck, build, bundle checks, npm audit |"
          echo "| Security | ${{ needs.security.result }} | pip-audit, Bandit, Semgrep, Trivy |"
          echo "| Docker Build | ${{ needs.docker-build.result }} | Multi-architecture builds |"
          echo "| Docker Test | ${{ needs.docker-test.result }} | Container smoke tests |"
          echo "| Deploy | ${{ needs.deploy.result }} | Staging deployment |"
          echo ""
          echo "**Commit:** ${{ github.sha }}"
          echo "**Branch:** ${{ github.ref }}"
          echo "**Trigger:** ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo ""
            echo "📦 Docker Image: ${{ env.DOCKER_IMAGE }}:latest"
            echo "🌐 Staging URL: http://${{ secrets.DEPLOY_HOST_STAGING }}:7779"
          fi

      - name: Create workflow summary
        run: |
          echo "## Ultimate UI Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Check | ${{ needs.frontend-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Test | ${{ needs.docker-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Deployment Information" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Docker Image:** \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Staging Environment:** http://${{ secrets.DEPLOY_HOST_STAGING }}:7779" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        continue-on-error: true
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            Ultimate UI Build ${{ github.event_name == 'push' && '✅ Success' || '⚠️ Completed' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Jobs:
            - Lint: ${{ needs.lint.result }}
            - Test: ${{ needs.test.result }}
            - Frontend: ${{ needs.frontend-check.result }}
            - Security: ${{ needs.security.result }}
            - Docker: ${{ needs.docker-build.result }}
            - Deploy: ${{ needs.deploy.result }}
            View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail if critical jobs failed
        if: |
          needs.test.result == 'failure' ||
          needs.frontend-check.result == 'failure' ||
          needs.security.result == 'failure' ||
          needs.docker-build.result == 'failure' ||
          needs.docker-test.result == 'failure'
        run: |
          echo "❌ Critical jobs failed! Build cannot proceed."
          echo ""
          echo "Failed jobs:"
          echo "- Test: ${{ needs.test.result }}"
          echo "- Frontend: ${{ needs.frontend-check.result }}"
          echo "- Security: ${{ needs.security.result }}"
          echo "- Docker Build: ${{ needs.docker-build.result }}"
          echo "- Docker Test: ${{ needs.docker-test.result }}"
          exit 1
