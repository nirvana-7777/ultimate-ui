# Minimal reverse proxy for Ultimate UI.
# Enable authentication before exposing this beyond a trusted network:
#   htpasswd -c nginx/.htpasswd admin    (then un-comment the volume in docker-compose.yml)
events {}

http {
  server {
    listen 80;
    client_max_body_size 1m;

    # auth_basic           "Ultimate UI";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # For TLS: terminate it here (listen 443 ssl; ssl_certificate ...) or in
    # an upstream proxy such as Traefik/Caddy.

    location / {
      proxy_pass http://ultimate-ui:7779;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Catchup downloads stream large .ts files through the UI.
      proxy_buffering off;
      proxy_read_timeout 330s;
    }
  }
}
